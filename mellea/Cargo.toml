[package]
name = "mellea"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Type-safe generative programming for Rust — structured LLM output with instruct-validate-repair loops"

[dependencies]
async-trait = "0.1"
ollama-rs = { version = "0.3", features = ["default"] }
reqwest = { version = "0.12", features = ["json"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "hello_world"
path = "../examples/hello_world.rs"

[[example]]
name = "sentiment"
path = "../examples/sentiment.rs"

[[example]]
name = "ivr_demo"
path = "../examples/ivr_demo.rs"

[[example]]
name = "generative_fn"
path = "../examples/generative_fn.rs"

[[example]]
name = "before_after"
path = "../examples/before_after.rs"
